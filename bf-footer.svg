<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 150" role="img" aria-label="Everything is permitted? I like the sound of that. Edward Kenway">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1a26"/><stop offset="1" stop-color="#0a0f1a"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="150" rx="18"/></clipPath>
    <path id="sine" d="M0 0 Q37.5 -9 75 0 T150 0 T225 0 T300 0 T375 0 T450 0 T525 0 T600 0 T675 0 T750 0 T825 0 T900 0 T975 0 T1050 0 T1125 0 T1200 0"/>
    <style>
      @font-face { font-family: 'Space Grotesk'; font-weight: 500; font-style: normal; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 500; font-style: normal; src: url(data:font/woff2;base64,) format('woff2'); }
      .run { animation: run 12s linear infinite; }
      .run.slow { animation-duration: 20s; }
      @keyframes run { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .q { font-family: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <g transform="translate(0 30)" fill="none" stroke="#3fb6a8" stroke-width="2.2">
      <g class="run"><use xlink:href="#sine"/><use xlink:href="#sine" x="1200"/></g>
    </g>
    <g transform="translate(0 42)" fill="none" stroke="#e3b341" stroke-opacity="0.25" stroke-width="1.5">
      <g class="run slow"><use xlink:href="#sine" x="-40"/><use xlink:href="#sine" x="1160"/></g>
    </g>
    <text x="600" y="98" text-anchor="middle" class="q" font-size="26" fill="#e6edf3">“Everything is permitted? I like the sound of that.”</text>
    <text x="600" y="128" text-anchor="middle" class="mono" font-size="14" fill="#e3b341" letter-spacing="1">— Edward Kenway</text>
  </g>
</svg>
